ci:
  # These require installing Python packages, so fail on pre-commit.ci
  skip: [pyright-pretty, ty-check]
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.0
  hooks:
    - id: ruff-check
    - id: ruff-format
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.10.0
  hooks:
    - id: uv-lock
- repo: https://github.com/northisup/pyright-pretty
  rev: v0.1.0
  hooks:
  - id: pyright-pretty
- repo: https://github.com/allganize/ty-pre-commit
  rev: v0.0.15
  hooks:
    - id: ty-check
